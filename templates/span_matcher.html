<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Span Matcher Test</title>
  <style>
    :root {
      --bg: #f4f4f2;
      --card: #ffffff;
      --text: #181818;
      --muted: #555555;
      --primary: #c8b15a;
      --primary-dark: #a48f3f;
      --border: #d8d8d4;
      --soft: #f8f7f2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #f6f6f4 0%, #f1f1ee 100%);
      color: var(--text);
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 16px 56px;
    }

    .page-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #ffffff;
      color: #1c1c1c;
      padding: 7px 12px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .nav-link:hover {
      border-color: var(--primary);
      background: #fffaf0;
    }

    .matcher-box {
      display: flex;
      gap: 10px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 8px 26px rgba(15, 23, 42, 0.06);
    }

    .matcher-box input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: none;
      font-size: 16px;
      padding: 10px 12px;
      background: transparent;
    }

    .matcher-box button {
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: #1c1c1c;
      padding: 10px 18px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 700;
    }

    .matcher-box button:hover {
      background: var(--primary-dark);
    }

    .matcher-box button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .status {
      margin: 14px 4px 10px;
      color: var(--muted);
      font-size: 14px;
      min-height: 22px;
    }

    .result-toolbar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin: 12px 0 10px;
    }

    .evidence-toggle {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      padding: 4px;
    }

    .evidence-toggle button {
      min-height: 32px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .evidence-toggle button:hover {
      background: var(--soft);
      color: var(--text);
    }

    .evidence-toggle button.active {
      background: var(--primary);
      color: #1c1c1c;
    }

    .results {
      display: grid;
      gap: 12px;
      margin-top: 8px;
    }

    .candidate {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      overflow-wrap: anywhere;
    }

    .candidate-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .candidate-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.4;
      font-weight: 800;
      color: #1b1b1b;
    }

    .candidate-meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .match-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .match-row {
      display: grid;
      grid-template-columns: minmax(92px, 130px) 1fr;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--soft);
    }

    .source {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      color: #3b3212;
    }

    .match-detail {
      display: grid;
      gap: 5px;
      color: #1e293b;
      font-size: 14px;
      line-height: 1.5;
    }

    .aliases {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .alias {
      display: inline-flex;
      max-width: 100%;
      border: 1px solid #e4d58a;
      border-radius: 999px;
      background: #fffdf0;
      color: #3b3212;
      padding: 3px 8px;
      font-size: 12px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .empty {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .container { padding-top: 20px; }
      h1 { font-size: 24px; }
      .matcher-box { flex-direction: column; }
      .matcher-box button { width: 100%; }
      .result-toolbar { align-items: stretch; }
      .evidence-toggle { width: 100%; }
      .evidence-toggle button { flex: 1; }
      .match-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-title">
      <h1>Span Matcher Test</h1>
      <a class="nav-link" href="/search">返回搜索</a>
    </div>

    <form id="matcherForm" class="matcher-box">
      <input id="queryInput" type="text" placeholder="输入 query，例如: t cell melanoma deep learning" required />
      <button id="matchBtn" type="submit">匹配</button>
    </form>

    <div id="status" class="status"></div>
    <div id="resultToolbar" class="result-toolbar">
      <div class="candidate-meta">显示 evidence</div>
      <div class="evidence-toggle" role="group" aria-label="显示 evidence">
        <button id="primaryEvidenceBtn" type="button" data-evidence-mode="primary">primary_evidence</button>
        <button id="allEvidenceBtn" type="button" data-evidence-mode="all">所有 evidence</button>
      </div>
    </div>
    <div id="results" class="results"></div>
  </div>

  <script>
    const initialQuery = {{ initial_query|tojson }};
    const form = document.getElementById("matcherForm");
    const queryInput = document.getElementById("queryInput");
    const matchBtn = document.getElementById("matchBtn");
    const statusEl = document.getElementById("status");
    const resultToolbar = document.getElementById("resultToolbar");
    const resultsEl = document.getElementById("results");
    const evidenceButtons = Array.from(document.querySelectorAll("[data-evidence-mode]"));
    let evidenceMode = "all";
    let currentCandidates = [];

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatConfidence(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return "-";
      return n.toFixed(3);
    }

    function renderAliases(aliases) {
      const visibleAliases = Array.isArray(aliases) ? aliases.filter(Boolean) : [];
      if (!visibleAliases.length) return "-";
      return `
        <span class="aliases">
          ${visibleAliases.map((alias) => `<span class="alias">${escapeHtml(alias)}</span>`).join("")}
        </span>
      `;
    }

    function renderMatch(match) {
      return `
        <div class="match-row">
          <div class="source">${escapeHtml(match.source || "-")}</div>
          <div class="match-detail">
            <div><strong>Canonical:</strong> ${escapeHtml(match.canonical || "-")}</div>
            <div><strong>Concept ID:</strong> ${escapeHtml(match.concept_id || "-")}</div>
            <div><strong>Match:</strong> ${escapeHtml(match.match_type || "-")} · <strong>Confidence:</strong> ${formatConfidence(match.confidence)}</div>
            <div><strong>Alias:</strong> ${renderAliases(match.aliases)}</div>
          </div>
        </div>
      `;
    }

    function getVisibleMatches(candidate) {
      const matches = Array.isArray(candidate.matches) ? candidate.matches : [];
      if (evidenceMode === "primary") {
        return matches.slice(0, 1);
      }
      return matches;
    }

    function renderCandidate(candidate, index) {
      const matches = getVisibleMatches(candidate);
      const matchHtml = matches.length
        ? matches.map(renderMatch).join("")
        : "<div class='empty'>无 match source</div>";

      return `
        <article class="candidate">
          <div class="candidate-head">
            <h2 class="candidate-title">${index + 1}. ${escapeHtml(candidate.text || "-")}</h2>
            <div class="candidate-meta">${escapeHtml(candidate.kind || "-")} · ${escapeHtml(candidate.start)}:${escapeHtml(candidate.end)}</div>
          </div>
          <div class="candidate-meta">normalized: ${escapeHtml(candidate.normalized_text || "-")}</div>
          <div class="match-list">${matchHtml}</div>
        </article>
      `;
    }

    async function runMatcher(query) {
      const url = `/api/span-matcher?query=${encodeURIComponent(query)}`;
      const resp = await fetch(url);
      const contentType = resp.headers.get("content-type") || "";
      if (!contentType.includes("application/json")) {
        const bodyText = await resp.text();
        const bodyPreview = bodyText.trim().slice(0, 120);
        throw new Error(`接口返回了非 JSON 响应（HTTP ${resp.status}）: ${bodyPreview || "empty response"}`);
      }
      const data = await resp.json();
      if (!resp.ok || !data.success) {
        throw new Error(data.error || "匹配失败");
      }
      return data;
    }

    function updateEvidenceButtons() {
      evidenceButtons.forEach((button) => {
        const isActive = button.dataset.evidenceMode === evidenceMode;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });
    }

    function renderResults() {
      updateEvidenceButtons();
      if (!currentCandidates.length) {
        resultsEl.innerHTML = "<div class='empty'>暂无 selected candidates</div>";
        return;
      }
      resultsEl.innerHTML = currentCandidates.map(renderCandidate).join("");
    }

    async function submitQuery(query) {
      if (!query) {
        statusEl.textContent = "请输入 query";
        return;
      }

      matchBtn.disabled = true;
      statusEl.textContent = "正在匹配...";
      resultToolbar.style.display = "none";
      currentCandidates = [];
      resultsEl.innerHTML = "";

      try {
        const data = await runMatcher(query);
        currentCandidates = data.selected_candidates || [];
        statusEl.textContent = `Selected candidates: ${currentCandidates.length}`;
        resultToolbar.style.display = currentCandidates.length ? "flex" : "none";
        renderResults();
      } catch (err) {
        statusEl.textContent = `错误: ${err.message}`;
      } finally {
        matchBtn.disabled = false;
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      submitQuery(queryInput.value.trim());
    });

    evidenceButtons.forEach((button) => {
      button.addEventListener("click", () => {
        evidenceMode = button.dataset.evidenceMode || "all";
        renderResults();
      });
    });

    updateEvidenceButtons();

    if (initialQuery) {
      queryInput.value = initialQuery;
      submitQuery(initialQuery);
    }
  </script>
</body>
</html>
