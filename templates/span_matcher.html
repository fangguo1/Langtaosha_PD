<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Span Matcher Test</title>
  <style>
    :root {
      --bg: #f4f4f2;
      --card: #ffffff;
      --text: #181818;
      --muted: #555555;
      --primary: #c8b15a;
      --primary-dark: #a48f3f;
      --border: #d8d8d4;
      --soft: #f8f7f2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #f6f6f4 0%, #f1f1ee 100%);
      color: var(--text);
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 16px 56px;
    }

    .page-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #ffffff;
      color: #1c1c1c;
      padding: 7px 12px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .nav-link:hover {
      border-color: var(--primary);
      background: #fffaf0;
    }

    .matcher-box {
      display: flex;
      gap: 10px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 8px 26px rgba(15, 23, 42, 0.06);
    }

    .matcher-box input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: none;
      font-size: 16px;
      padding: 10px 12px;
      background: transparent;
    }

    .matcher-box button {
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: #1c1c1c;
      padding: 10px 18px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 700;
    }

    .matcher-box button:hover {
      background: var(--primary-dark);
    }

    .matcher-box button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .status {
      margin: 14px 4px 10px;
      color: var(--muted);
      font-size: 14px;
      min-height: 22px;
    }

    .result-toolbar {
      display: none;
      align-items: stretch;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin: 12px 0 10px;
    }

    .timing-panel {
      display: grid;
      gap: 8px;
      flex: 1 1 320px;
      min-width: 240px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .timing-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;
      flex-wrap: wrap;
    }

    .timing-title {
      font-size: 14px;
      font-weight: 800;
      color: #1b1b1b;
    }

    .timing-total {
      font-size: 18px;
      font-weight: 800;
      color: #3b3212;
    }

    .timing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 8px;
    }

    .timing-chip {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--soft);
      padding: 8px 10px;
    }

    .timing-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .timing-value {
      font-size: 14px;
      font-weight: 800;
      color: #1c1c1c;
    }

    .evidence-toggle {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      padding: 4px;
    }

    .evidence-toggle button {
      min-height: 32px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .evidence-toggle button:hover {
      background: var(--soft);
      color: var(--text);
    }

    .evidence-toggle button.active {
      background: var(--primary);
      color: #1c1c1c;
    }

    .results {
      display: grid;
      gap: 12px;
      margin-top: 8px;
    }

    .results-title {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 800;
      color: #1b1b1b;
    }

    .span-card {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      overflow-wrap: anywhere;
    }

    .span-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .span-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.4;
      font-weight: 800;
      color: #1b1b1b;
    }

    .span-meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .term-section {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .term-row {
      display: grid;
      gap: 6px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--soft);
    }

    .term-label {
      font-size: 13px;
      font-weight: 800;
      color: #3b3212;
    }

    .aliases {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .alias {
      display: inline-flex;
      max-width: 100%;
      border: 1px solid #e4d58a;
      border-radius: 999px;
      background: #fffdf0;
      color: #3b3212;
      padding: 3px 8px;
      font-size: 12px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .alias.prefix {
      border-color: #c7b3f3;
      background: #f7f1ff;
      color: #4f3a79;
    }

    .children-block {
      margin-top: 12px;
      border-top: 1px dashed var(--border);
      padding-top: 12px;
    }

    .children-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fffaf0;
      color: #3b3212;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .children-list {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .child-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fbfbf8;
      padding: 12px;
    }

    .child-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .child-title {
      font-size: 15px;
      font-weight: 800;
      color: #1c1c1c;
    }

    .child-meta {
      font-size: 12px;
      color: var(--muted);
    }

    .empty {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .container { padding-top: 20px; }
      h1 { font-size: 24px; }
      .matcher-box { flex-direction: column; }
      .matcher-box button { width: 100%; }
      .result-toolbar { align-items: stretch; }
      .timing-panel { min-width: 0; }
      .evidence-toggle { width: 100%; }
      .evidence-toggle button { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-title">
      <h1>Span Matcher Test</h1>
      <a class="nav-link" href="/search">返回搜索</a>
    </div>

    <form id="matcherForm" class="matcher-box">
      <input id="queryInput" type="text" placeholder="输入 query，例如: t cell melanoma deep learning" required />
      <button id="matchBtn" type="submit">匹配</button>
    </form>

    <div id="status" class="status"></div>
    <div id="resultToolbar" class="result-toolbar">
      <div id="timingPanel" class="timing-panel"></div>
      <div class="evidence-toggle" role="group" aria-label="显示 evidence">
        <button id="primaryEvidenceBtn" type="button" data-evidence-mode="primary">primary_evidence</button>
        <button id="allEvidenceBtn" type="button" data-evidence-mode="all">所有 evidence</button>
      </div>
    </div>
    <div class="results-title">Semantic spans</div>
    <div id="results" class="results"></div>
  </div>

  <script>
    const initialQuery = {{ initial_query|tojson }};
    const form = document.getElementById("matcherForm");
    const queryInput = document.getElementById("queryInput");
    const matchBtn = document.getElementById("matchBtn");
    const statusEl = document.getElementById("status");
    const resultToolbar = document.getElementById("resultToolbar");
    const timingPanel = document.getElementById("timingPanel");
    const resultsEl = document.getElementById("results");
    const evidenceButtons = Array.from(document.querySelectorAll("[data-evidence-mode]"));
    let evidenceMode = "all";
    let currentCandidates = [];
    let currentSemanticPlan = null;
    let currentTimings = null;

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatConfidence(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return "-";
      return n.toFixed(3);
    }

    function formatMs(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return "-";
      return `${n.toFixed(1)} ms`;
    }

    function renderTermChips(terms) {
      const visibleTerms = Array.isArray(terms) ? terms.filter((term) => term && term.text) : [];
      if (!visibleTerms.length) return "<span class='empty'>无 term</span>";
      return `
        <span class="aliases">
          ${visibleTerms.map((term) => {
            const klass = term.match_mode === "prefix" ? "alias prefix" : "alias";
            return `<span class="${klass}">${escapeHtml(term.text)} · ${escapeHtml(term.match_mode || "exact")}</span>`;
          }).join("")}
        </span>
      `;
    }

    function renderAliases(aliases) {
      const visibleAliases = Array.isArray(aliases) ? aliases.filter(Boolean) : [];
      if (!visibleAliases.length) return "-";
      return `
        <span class="aliases">
          ${visibleAliases.map((alias) => `<span class="alias">${escapeHtml(alias)}</span>`).join("")}
        </span>
      `;
    }

    function getVisibleMatches(candidate) {
      const matches = Array.isArray(candidate.matches) ? candidate.matches : [];
      if (evidenceMode === "primary") {
        return matches.slice(0, 1);
      }
      return matches;
    }

    function renderCandidate(candidate, index) {
      const matches = getVisibleMatches(candidate);
      const matchHtml = matches.length
        ? matches.map((match) => `
          <div class="term-row">
            <div class="term-label">${escapeHtml(match.source || "-")}</div>
            <div class="span-meta"><strong>Canonical:</strong> ${escapeHtml(match.canonical || "-")}</div>
            <div class="span-meta"><strong>Concept ID:</strong> ${escapeHtml(match.concept_id || "-")}</div>
            <div class="span-meta"><strong>Match:</strong> ${escapeHtml(match.match_type || "-")} · <strong>Confidence:</strong> ${formatConfidence(match.confidence)}</div>
            <div class="span-meta"><strong>Alias:</strong> ${renderAliases(match.aliases)}</div>
          </div>
        `).join("")
        : "<div class='empty'>无 match source</div>";

      return `
        <article class="child-card">
          <div class="child-head">
            <div class="child-title">Candidate ${index + 1}: ${escapeHtml(candidate.text || "-")}</div>
            <div class="child-meta">${escapeHtml(candidate.kind || "-")} · ${escapeHtml(candidate.start)}:${escapeHtml(candidate.end)}</div>
          </div>
          <div class="span-meta">normalized: ${escapeHtml(candidate.normalized_text || "-")}</div>
          <div class="term-section">${matchHtml}</div>
        </article>
      `;
    }

    function renderChildren(children, parentSpanId) {
      if (!Array.isArray(children) || !children.length) {
        return "<div class='span-meta'>No children</div>";
      }

      return `
        <details class="children-block">
          <summary class="children-toggle">Children (${children.length}) · 点击展开</summary>
          <div class="children-list">
            ${children.map((child) => `
              <article class="child-card" id="${escapeHtml(`${parentSpanId}-${child.span_id}`)}">
                <div class="child-head">
                  <div class="child-title">${escapeHtml(child.span_id)} · ${escapeHtml(child.surface_text || "-")}</div>
                  <div class="child-meta">${escapeHtml(child.start)}:${escapeHtml(child.end)}</div>
                </div>
                <div class="span-meta">canonical: ${escapeHtml(child.canonical_text || "-")}</div>
                <div class="term-section">
                  <div class="term-row">
                    <div class="term-label">own.tier1</div>
                    <div>${renderTermChips(child.own_terms?.tier1)}</div>
                  </div>
                  <div class="term-row">
                    <div class="term-label">own.tier2</div>
                    <div>${renderTermChips(child.own_terms?.tier2)}</div>
                  </div>
                </div>
              </article>
            `).join("")}
          </div>
        </details>
      `;
    }

    function renderSemanticSpan(span, index) {
      return `
        <article class="span-card">
          <div class="span-head">
            <h2 class="span-title">${index + 1}. ${escapeHtml(span.surface_text || "-")}</h2>
            <div class="span-meta">${escapeHtml(span.span_id || "-")} · ${escapeHtml(span.start)}:${escapeHtml(span.end)}</div>
          </div>
          <div class="span-meta">canonical: ${escapeHtml(span.canonical_text || "-")}</div>
          <div class="span-meta">normalized: ${escapeHtml(span.normalized_text || "-")}</div>
          <div class="term-section">
            <div class="term-row">
              <div class="term-label">own.tier1</div>
              <div>${renderTermChips(span.own_terms?.tier1)}</div>
            </div>
            <div class="term-row">
              <div class="term-label">own.tier2</div>
              <div>${renderTermChips(span.own_terms?.tier2)}</div>
            </div>
          </div>
          ${renderChildren(span.children, span.span_id)}
        </article>
      `;
    }

    function renderTimingPanel() {
      if (!currentTimings) {
        timingPanel.innerHTML = "";
        return;
      }
      const timings = currentTimings.timings_ms || {};
      const steps = [
        ["normalize", "Normalize"],
        ["extract", "Extract"],
        ["match", "Match"],
        ["select", "Select"],
        ["build_plan", "Build Plan"],
      ];
      timingPanel.innerHTML = `
        <div class="timing-header">
          <div class="timing-title">响应时间</div>
          <div class="timing-total">${formatMs(currentTimings.elapsed_ms)}</div>
        </div>
        <div class="timing-grid">
          ${steps.map(([key, label]) => `
            <div class="timing-chip">
              <div class="timing-label">${label}</div>
              <div class="timing-value">${formatMs(timings[key])}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    async function runMatcher(query) {
      const url = `/api/span-matcher?query=${encodeURIComponent(query)}`;
      const resp = await fetch(url);
      const contentType = resp.headers.get("content-type") || "";
      if (!contentType.includes("application/json")) {
        const bodyText = await resp.text();
        const bodyPreview = bodyText.trim().slice(0, 120);
        throw new Error(`接口返回了非 JSON 响应（HTTP ${resp.status}）: ${bodyPreview || "empty response"}`);
      }
      const data = await resp.json();
      if (!resp.ok || !data.success) {
        throw new Error(data.error || "匹配失败");
      }
      return data;
    }

    function updateEvidenceButtons() {
      evidenceButtons.forEach((button) => {
        const isActive = button.dataset.evidenceMode === evidenceMode;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });
    }

    function renderResults() {
      updateEvidenceButtons();
      renderTimingPanel();
      const spans = currentSemanticPlan?.spans || [];
      if (!spans.length) {
        resultsEl.innerHTML = "<div class='empty'>暂无 semantic spans</div>";
        return;
      }
      resultsEl.innerHTML = spans.map(renderSemanticSpan).join("");
    }

    async function submitQuery(query) {
      if (!query) {
        statusEl.textContent = "请输入 query";
        return;
      }

      matchBtn.disabled = true;
      statusEl.textContent = "正在匹配...";
      resultToolbar.style.display = "none";
      currentCandidates = [];
      currentSemanticPlan = null;
      currentTimings = null;
      resultsEl.innerHTML = "";
      timingPanel.innerHTML = "";

      try {
        const data = await runMatcher(query);
        currentCandidates = data.selected_candidates || [];
        currentSemanticPlan = data.semantic_plan || null;
        currentTimings = {
          elapsed_ms: data.elapsed_ms,
          timings_ms: data.timings_ms || {},
        };
        const spanCount = currentSemanticPlan?.spans?.length || 0;
        statusEl.textContent = `Semantic spans: ${spanCount} · Selected candidates: ${currentCandidates.length}`;
        resultToolbar.style.display = "flex";
        renderResults();
      } catch (err) {
        statusEl.textContent = `错误: ${err.message}`;
      } finally {
        matchBtn.disabled = false;
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      submitQuery(queryInput.value.trim());
    });

    evidenceButtons.forEach((button) => {
      button.addEventListener("click", () => {
        evidenceMode = button.dataset.evidenceMode || "all";
        renderResults();
      });
    });

    updateEvidenceButtons();

    if (initialQuery) {
      queryInput.value = initialQuery;
      submitQuery(initialQuery);
    }
  </script>
</body>
</html>
