<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>反馈模式</title>
  <style>
    :root {
      --bg: #f4f4f2;
      --card: #ffffff;
      --text: #181818;
      --muted: #555555;
      --primary: #c8b15a;
      --primary-dark: #a48f3f;
      --border: #d8d8d4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #f6f6f4 0%, #f1f1ee 100%);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      padding: 56px 16px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 8px 26px rgba(15, 23, 42, 0.06);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.25;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #ffffff;
      color: var(--text);
      padding: 11px 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(200, 177, 90, 0.18);
    }

    button {
      width: 100%;
      margin-top: 14px;
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: #1c1c1c;
      padding: 11px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: var(--primary-dark);
    }

    .back-link {
      display: inline-block;
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
      text-decoration: none;
    }

    .back-link:hover {
      color: var(--text);
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="panel">
      <h1>反馈模式</h1>
      <p>请输入研究参与者编号。请使用匿名编号，不要填写真实姓名、手机号或邮箱。</p>
      <form action="/study/search" method="get">
        <input type="hidden" name="study_session_id" value="{{ study_session_id }}" />
        <label for="participantId">Participant ID</label>
        <input
          id="participantId"
          name="participant_id"
          type="text"
          placeholder="例如：p01"
          maxlength="120"
          autocomplete="off"
          required
        />
        <button type="submit">进入反馈模式</button>
      </form>
      <a class="back-link" href="/">返回普通搜索</a>
    </section>
  </main>
</body>
</html>
