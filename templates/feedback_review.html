<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback Review</title>
  <style>
    :root {
      --bg: #f4f4f2;
      --card: #ffffff;
      --text: #181818;
      --muted: #555555;
      --primary: #c8b15a;
      --border: #d8d8d4;
      --good: #146c43;
      --good-bg: #e8f5ee;
      --bad: #b42318;
      --bad-bg: #fff0ed;
      --neutral-bg: #f8fafc;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #f6f6f4 0%, #f1f1ee 100%);
      color: var(--text);
      min-height: 100vh;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      border-right: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.74);
      padding: 22px 16px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .main {
      min-width: 0;
      padding: 28px 24px 56px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 26px;
      line-height: 1.25;
    }

    .subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .label {
      display: block;
      margin: 16px 0 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #ffffff;
      color: var(--text);
      padding: 9px 10px;
      font: inherit;
      font-size: 14px;
      outline: none;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .metric, .query-card, .controls, .paper, .empty {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .metric { padding: 12px; }
    .metric span { display: block; color: var(--muted); font-size: 12px; font-weight: 700; }
    .metric strong { display: block; margin-top: 5px; font-size: 18px; line-height: 1.3; overflow-wrap: anywhere; }

    .query-card { padding: 14px; margin-bottom: 14px; }
    .query-title { margin: 0 0 8px; font-size: 20px; line-height: 1.35; overflow-wrap: anywhere; }
    .meta { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; overflow-wrap: anywhere; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 14px;
      padding: 12px;
    }

    .control-group { display: grid; gap: 7px; }
    .control-title { color: var(--muted); font-size: 12px; font-weight: 700; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip, .rank-dot {
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #ffffff;
      color: #1e293b;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .chip { padding: 6px 10px; }
    .chip.active { border-color: var(--primary); background: #fff8dc; color: #1c1c1c; }

    .rank-strip { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .rank-dot { width: 34px; height: 30px; padding: 0; }
    .rank-dot.good { border-color: #7fc6a1; background: var(--good-bg); color: var(--good); }
    .rank-dot.bad { border-color: #f2a49b; background: var(--bad-bg); color: var(--bad); }
    .rank-dot.unlabeled { background: var(--neutral-bg); color: var(--muted); }

    .results { display: grid; gap: 14px; }
    .paper { padding: 16px; overflow-wrap: anywhere; }
    .paper.feedback-good { border-color: #a6d9bd; }
    .paper.feedback-bad { border-color: #efb1aa; }
    .paper-head { display: flex; gap: 10px; align-items: flex-start; }
    .rank-badge {
      flex: 0 0 auto;
      min-width: 38px;
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #f8fafc;
      color: #1e293b;
      font-size: 13px;
      font-weight: 800;
    }

    .title { margin: 0 0 8px; font-size: 18px; font-weight: 700; line-height: 1.4; }
    .abstract { margin: 0; line-height: 1.7; color: #1e293b; font-size: 14px; white-space: pre-wrap; }
    .feedback-box { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
    .feedback-pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 800;
    }
    .feedback-pill.good { background: var(--good-bg); color: var(--good); border: 1px solid #9bd0b5; }
    .feedback-pill.bad { background: var(--bad-bg); color: var(--bad); border: 1px solid #efb1aa; }
    .feedback-pill.none { background: var(--neutral-bg); color: var(--muted); border: 1px solid var(--border); }

    .empty { padding: 18px; color: var(--muted); }

    @media (max-width: 920px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); }
      .main { padding: 20px 16px 48px; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>Feedback Review</h1>
      <p class="subtitle">Query-level testbed review page. Labels come from the frozen retrieval testbed JSON; titles and abstracts are hydrated from the metadata database.</p>

      <label class="label" for="annotatorSelect">Annotator</label>
      <select id="annotatorSelect"></select>

      <label class="label" for="querySelect">Query</label>
      <select id="querySelect"></select>
    </aside>

    <main class="main">
      <section id="summary" class="summary"></section>
      <section id="queryCard" class="query-card"></section>
      <section id="controls" class="controls"></section>
      <section id="rankStrip" class="rank-strip"></section>
      <section id="results" class="results"></section>
    </main>
  </div>

  <script>
    const DATA_URL = "/api/study/feedback-review-data";
    const annotatorSelect = document.getElementById("annotatorSelect");
    const querySelect = document.getElementById("querySelect");
    const summaryEl = document.getElementById("summary");
    const queryCardEl = document.getElementById("queryCard");
    const controlsEl = document.getElementById("controls");
    const rankStripEl = document.getElementById("rankStrip");
    const resultsEl = document.getElementById("results");

    let reviewData = { testbed_name: "", summary: {}, queries: [] };
    let selectedAnnotator = "__all__";
    let selectedQueryId = "";
    let labelFilter = "all";
    let sourceFilter = "all";

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function normalizeSourceKey(value) {
      const raw = String(value || "").toLowerCase();
      if (raw.includes("biorxiv")) return "biorxiv";
      if (raw.includes("langtaosha")) return "langtaosha";
      return raw || "unknown";
    }

    function feedbackClass(label) {
      if (Number(label) > 0) return "good";
      if (Number(label) === 0) return "bad";
      return "unlabeled";
    }

    function feedbackLabel(label) {
      if (Number(label) > 0) return "Relevant";
      if (Number(label) === 0) return "Not relevant";
      return "Unknown";
    }

    function metric(label, value) {
      return `<div class="metric"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`;
    }

    function allQueries() {
      return Array.isArray(reviewData.queries) ? reviewData.queries : [];
    }

    function reviewQueries() {
      return allQueries().filter((item) => {
        if (selectedAnnotator === "__all__") return true;
        return (item.annotator_ids || []).includes(selectedAnnotator);
      });
    }

    function currentQuery() {
      return allQueries().find((item) => String(item.query_id) === String(selectedQueryId)) || null;
    }

    function setOptions(select, options, value) {
      select.innerHTML = options.map((option) => {
        const selected = String(option.value) === String(value) ? "selected" : "";
        return `<option value="${escapeHtml(option.value)}" ${selected}>${escapeHtml(option.label)}</option>`;
      }).join("");
    }

    function renderAnnotatorOptions() {
      const annotators = Array.from(
        new Set(allQueries().flatMap((item) => item.annotator_ids || []).filter(Boolean))
      ).sort((a, b) => String(a).localeCompare(String(b)));
      const options = [
        { value: "__all__", label: `All annotators (${annotators.length})` },
        ...annotators.map((annotator) => ({ value: annotator, label: annotator })),
      ];
      if (!options.some((item) => item.value === selectedAnnotator)) selectedAnnotator = "__all__";
      setOptions(annotatorSelect, options, selectedAnnotator);
    }

    function renderQueryOptions() {
      const queries = reviewQueries().slice().sort((a, b) => Number(a.query_id) - Number(b.query_id));
      if (!queries.some((item) => String(item.query_id) === String(selectedQueryId))) {
        selectedQueryId = queries.length ? String(queries[0].query_id) : "";
      }
      const options = queries.map((query) => ({
        value: String(query.query_id),
        label: `#${query.query_id} | ${query.query_text} (${query.label_summary?.positive || 0}/${query.label_summary?.negative || 0})`,
      }));
      setOptions(querySelect, options, selectedQueryId);
    }

    function updateUrl() {
      const params = new URLSearchParams();
      if (selectedAnnotator && selectedAnnotator !== "__all__") params.set("annotator", selectedAnnotator);
      if (selectedQueryId) params.set("query_id", selectedQueryId);
      window.history.replaceState(null, "", `${window.location.pathname}?${params.toString()}`);
    }

    function renderSummary(query) {
      const summary = reviewData.summary || {};
      summaryEl.innerHTML = [
        metric("Testbed", reviewData.testbed_name || "-"),
        metric("Queries", `${summary.query_count || allQueries().length || 0}`),
        metric("Positive labels", `${summary.positive_count || 0}`),
        metric("Negative labels", `${summary.negative_count || 0}`),
        metric("Current query", query ? `#${query.query_id}` : "-"),
      ].join("");
    }

    function renderQueryCard(query) {
      if (!query) {
        queryCardEl.innerHTML = "<div class='empty'>No query selected</div>";
        return;
      }
      queryCardEl.innerHTML = `
        <h2 class="query-title">${escapeHtml(query.query_text || "-")}</h2>
        <p class="meta"><strong>Query ID:</strong> #${escapeHtml(query.query_id)}</p>
        <p class="meta"><strong>Annotators:</strong> ${escapeHtml((query.annotator_ids || []).join(", ") || "-")} | <strong>Annotator count:</strong> ${escapeHtml(query.annotator_count || 0)}</p>
        <p class="meta"><strong>Labels:</strong> ${escapeHtml(query.label_summary?.positive || 0)} relevant / ${escapeHtml(query.label_summary?.negative || 0)} not relevant</p>
      `;
    }

    function makeChip(label, value, activeValue) {
      return `<button type="button" class="chip ${value === activeValue ? "active" : ""}" data-chip="${escapeHtml(value)}">${escapeHtml(label)}</button>`;
    }

    function sourceCounts(results) {
      return results.reduce((acc, result) => {
        const key = normalizeSourceKey(result.source_key || result.source);
        acc[key] = (acc[key] || 0) + 1;
        acc.all += 1;
        return acc;
      }, { all: 0 });
    }

    function renderControls(query) {
      if (!query) {
        controlsEl.innerHTML = "";
        return;
      }
      const results = query.results || [];
      const labelCounts = {
        all: results.length,
        relevant: results.filter((item) => Number(item.label) > 0).length,
        not_relevant: results.filter((item) => Number(item.label) === 0).length,
      };
      const sources = sourceCounts(results);
      controlsEl.innerHTML = `
        <div class="control-group">
          <span class="control-title">Label</span>
          <div class="chips" data-control="label">
            ${makeChip(`All (${labelCounts.all})`, "all", labelFilter)}
            ${makeChip(`Relevant (${labelCounts.relevant})`, "relevant", labelFilter)}
            ${makeChip(`Not relevant (${labelCounts.not_relevant})`, "not_relevant", labelFilter)}
          </div>
        </div>
        <div class="control-group">
          <span class="control-title">Source</span>
          <div class="chips" data-control="source">
            ${makeChip(`All (${sources.all || 0})`, "all", sourceFilter)}
            ${makeChip(`Langtaosha (${sources.langtaosha || 0})`, "langtaosha", sourceFilter)}
            ${makeChip(`Biorxiv (${sources.biorxiv || 0})`, "biorxiv", sourceFilter)}
          </div>
        </div>
      `;
    }

    function resultMatchesFilters(result) {
      const sourceKey = normalizeSourceKey(result.source_key || result.source);
      const sourceOk = sourceFilter === "all" || sourceKey === sourceFilter;
      let labelOk = true;
      if (labelFilter === "relevant") labelOk = Number(result.label) > 0;
      if (labelFilter === "not_relevant") labelOk = Number(result.label) === 0;
      return sourceOk && labelOk;
    }

    function renderRankStrip(query) {
      const results = query ? (query.results || []) : [];
      rankStripEl.innerHTML = results.map((result, idx) => {
        const cls = feedbackClass(result.label);
        return `<button type="button" class="rank-dot ${cls}" data-rank-target="${idx + 1}">${idx + 1}</button>`;
      }).join("");
    }

    function renderResult(result, rank) {
      const cls = Number(result.label) > 0 ? "feedback-good" : (Number(result.label) === 0 ? "feedback-bad" : "");
      const link = result.link ? `<a href="${escapeHtml(result.link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(result.link)}</a>` : "-";
      return `
        <article class="paper ${cls}" id="result-rank-${rank}">
          <div class="paper-head">
            <span class="rank-badge">#${rank}</span>
            <div>
              <h2 class="title">${escapeHtml(result.title || "(无标题)")}</h2>
              <p class="meta"><strong>Authors:</strong> ${escapeHtml(result.authors || "未知作者")}</p>
              <p class="meta"><strong>Source:</strong> ${escapeHtml(result.source || "-")} | <strong>Online Date:</strong> ${escapeHtml(result.online_date || "-")} | <strong>Work ID:</strong> ${escapeHtml(result.work_id || "-")}</p>
              <p class="meta"><strong>DOI:</strong> ${escapeHtml(result.doi || "-")}</p>
              <p class="meta"><strong>Link:</strong> ${link}</p>
            </div>
          </div>
          <p class="meta"><strong>ABSTRACT</strong></p>
          <p class="abstract">${escapeHtml(result.abstract || "(无摘要)")}</p>
          <div class="feedback-box">
            <span class="feedback-pill ${feedbackClass(result.label)}">${escapeHtml(feedbackLabel(result.label))}</span>
          </div>
        </article>
      `;
    }

    function renderResults(query) {
      if (!query) {
        resultsEl.innerHTML = "<div class='empty'>No data</div>";
        return;
      }
      const filtered = (query.results || []).filter(resultMatchesFilters);
      if (!filtered.length) {
        resultsEl.innerHTML = "<div class='empty'>No results for current filters</div>";
        return;
      }
      resultsEl.innerHTML = filtered.map((result, idx) => renderResult(result, idx + 1)).join("");
    }

    function renderAll() {
      renderAnnotatorOptions();
      renderQueryOptions();
      const query = currentQuery();
      renderSummary(query);
      renderQueryCard(query);
      renderControls(query);
      renderRankStrip(query);
      renderResults(query);
      updateUrl();
    }

    async function loadData() {
      summaryEl.innerHTML = metric("Loading", "...");
      const resp = await fetch(DATA_URL, { credentials: "same-origin" });
      const data = await resp.json();
      if (!resp.ok || !data.success) throw new Error(data.error || "Failed to load feedback data");
      reviewData = {
        testbed_name: data.testbed_name || "",
        summary: data.summary || {},
        queries: data.queries || [],
      };
      const params = new URLSearchParams(window.location.search);
      selectedAnnotator = params.get("annotator") || "__all__";
      selectedQueryId = params.get("query_id") || "";
      renderAll();
    }

    annotatorSelect.addEventListener("change", () => {
      selectedAnnotator = annotatorSelect.value;
      selectedQueryId = "";
      labelFilter = "all";
      sourceFilter = "all";
      renderAll();
    });

    querySelect.addEventListener("change", () => {
      selectedQueryId = querySelect.value;
      labelFilter = "all";
      sourceFilter = "all";
      renderAll();
    });

    controlsEl.addEventListener("click", (event) => {
      const chip = event.target.closest(".chip");
      if (!chip) return;
      const group = chip.parentElement?.dataset.control;
      if (group === "source") sourceFilter = chip.dataset.chip;
      if (group === "label") labelFilter = chip.dataset.chip;
      renderAll();
    });

    rankStripEl.addEventListener("click", (event) => {
      const dot = event.target.closest(".rank-dot");
      if (!dot) return;
      const target = document.getElementById(`result-rank-${dot.dataset.rankTarget}`);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    loadData().catch((error) => {
      summaryEl.innerHTML = metric("Error", error.message || "Failed to load");
      queryCardEl.innerHTML = `<div class="empty">${escapeHtml(error.message || "Failed to load feedback review data")}</div>`;
      controlsEl.innerHTML = "";
      rankStripEl.innerHTML = "";
      resultsEl.innerHTML = "";
    });
  </script>
</body>
</html>
